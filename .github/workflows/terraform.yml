---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@0a52139c68ca1ee24a6074a88dfa7876456e9f2c # main
    name: Module Validation
    with:
      working-directory: .

  shared-module-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@0a52139c68ca1ee24a6074a88dfa7876456e9f2c # main
    name: Shared Module Validation
    with:
      working-directory: modules/shared

  nacls-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@0a52139c68ca1ee24a6074a88dfa7876456e9f2c # main
    name: NACLS Validation
    with:
      working-directory: modules/nacls
